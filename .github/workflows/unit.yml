name: Unit Tests
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
jobs:
    unit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
            - run: npm ci
            - run: npm run test:unit
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: coverage-unit
                  path: coverage/
