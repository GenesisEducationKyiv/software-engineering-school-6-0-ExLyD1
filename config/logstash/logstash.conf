input {
    gelf {
        port => 12201
    }
}

filter {
    if [short_message] {
        json {
            source => "short_message"
            target => "app"
        }
    } else {
        json {
            source => "message"
            target => "app"
        }
    }

    date {
        match => ["[app][time]", "UNIX_MS"]
        target => "@timestamp"
    }

    translate {
        source => "[app][level]"
        target => "[log][level]"
        dictionary => {
            "10" => "trace"
            "20" => "debug"
            "30" => "info"
            "40" => "warn"
            "50" => "error"
            "60" => "fatal"
        }
        fallback => "unknown"
    }

    mutate {
        rename => {
            "[app][msg]" => "message"
            "[app][service][name]" => "[service][name]"
            "[app][component]" => "component"
            "[app][requestId]" => "requestId"
            "[app][req][method]" => "method"
            "[app][req][url]" => "path"
            "[app][req][userAgent]" => "userAgent"
            "[app][req][remoteAddress]" => "remoteAddress"
            "[app][res][statusCode]" => "statusCode"
            "[app][responseTime]" => "durationMs"
            "[app][repository]" => "repository"
            "[app][tag]" => "releaseTag"
            "[app][subscriberCount]" => "subscriberCount"
            "[app][err]" => "error"
        }
    }

    mutate {
        remove_field => ["app", "short_message", "version", "source_host", "level", "command", "created"]
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "github-release-notifier-logs-%{+YYYY.MM.dd}"
    }
}
