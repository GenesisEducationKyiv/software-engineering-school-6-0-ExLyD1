services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d github_notifier_genesis']
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s

    app:
        build: .
        env_file: .env
        environment:
            DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            PORT: 3000
            BASE_URL: ${BASE_URL}
            API_KEY: ${API_KEY}
        ports:
            - '3000:3000'
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres_data:
