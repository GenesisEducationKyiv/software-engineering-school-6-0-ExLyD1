services:
    postgres-test:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: test
            POSTGRES_PASSWORD: test
            POSTGRES_DB: github_notifier_test
        ports:
            - '5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U test -d github_notifier_test']
            interval: 3s
            timeout: 3s
            retries: 10
            start_period: 5s
        tmpfs:
            - /var/lib/postgresql/data
